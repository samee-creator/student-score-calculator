<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Score Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Student Score Calculator</h2>
    
    <table>
      <thead>
        <tr>
          <th>S/N</th>
          <th>Name</th>
          <th>CA 1 (/10)</th>
          <th>CA 2 (/10)</th>
          <th>CA 3 (/10)</th>
          <th>Exam (/70)</th>
          <th>Total (/100)</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <tr class="student-row">
          <td>1</td>
          <td><input type="text" class="student-name" placeholder="Student Name" value="Student 1"></td>
          <td><input type="number" class="ca1" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca2" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca3" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="exam" min="0" max="70" placeholder="0-70"></td>
          <td class="total">-</td>
          <td class="grade">-</td>
        </tr>
        <tr class="student-row">
          <td>2</td>
          <td><input type="text" class="student-name" placeholder="Student Name" value="Student 2"></td>
          <td><input type="number" class="ca1" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca2" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca3" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="exam" min="0" max="70" placeholder="0-70"></td>
          <td class="total">-</td>
          <td class="grade">-</td>
        </tr>
        <tr class="student-row">
          <td>3</td>
          <td><input type="text" class="student-name" placeholder="Student Name" value="Student 3"></td>
          <td><input type="number" class="ca1" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca2" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca3" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="exam" min="0" max="70" placeholder="0-70"></td>
          <td class="total">-</td>
          <td class="grade">-</td>
        </tr>
        <tr class="student-row">
          <td>4</td>
          <td><input type="text" class="student-name" placeholder="Student Name" value="Student 4"></td>
          <td><input type="number" class="ca1" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca2" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca3" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="exam" min="0" max="70" placeholder="0-70"></td>
          <td class="total">-</td>
          <td class="grade">-</td>
        </tr>
        <tr class="student-row">
          <td>5</td>
          <td><input type="text" class="student-name" placeholder="Student Name" value="Student 5"></td>
          <td><input type="number" class="ca1" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca2" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="ca3" min="0" max="10" placeholder="0-10"></td>
          <td><input type="number" class="exam" min="0" max="70" placeholder="0-70"></td>
          <td class="total">-</td>
          <td class="grade">-</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
